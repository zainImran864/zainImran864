      <rect x="0" y="0" width="211.0" height="12" fill="#3178C6" /><rect x="211.0" y="0" width="188.5" height="12" fill="#F7DF1E" /><rect x="399.5" y="0" width="100.5" height="12" fill="#E34C26" />
    </g>

