        <rect x="160" y="-10" width="101.3" height="8" rx="4" fill="#3178C6" />
        <text x="495" y="0" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600" fill="#94A3B8">42.2%</text>
      </g>
      <g transform="translate(0, 170)">
        <circle cx="8" cy="-4" r="5" fill="#F7DF1E" />
        <text x="22" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">JavaScript</text>
        <rect x="160" y="-10" width="240" height="8" rx="4" fill="#1E293B" />
        <rect x="160" y="-10" width="90.5" height="8" rx="4" fill="#F7DF1E" />
        <text x="495" y="0" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600" fill="#94A3B8">37.7%</text>
      </g>
      <g transform="translate(0, 200)">
        <circle cx="8" cy="-4" r="5" fill="#E34C26" />
        <text x="22" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">HTML/CSS</text>
        <rect x="160" y="-10" width="240" height="8" rx="4" fill="#1E293B" />
        <rect x="160" y="-10" width="48.2" height="8" rx="4" fill="#E34C26" />
        <text x="495" y="0" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600" fill="#94A3B8">20.1%</text>
