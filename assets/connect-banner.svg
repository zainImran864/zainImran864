      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="connWave" x1="0%" y1="0%" x2="100%" y2="0%">
