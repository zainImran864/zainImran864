name: Profile Telemetry & SVG Engine

on:
  schedule:
    # Runs once a week on Mondays at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_profile_svgs.py"
      - ".github/workflows/profile-telemetry-svg.yml"

permissions:
  contents: write

concurrency:
  group: profile-auto-commit
  cancel-in-progress: false

jobs:
  telemetry-svg:
    name: Build & Verify Profile Telemetry SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Custom SVG Banners & Live Telemetry Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_profile_svgs.py

      - name: Validate SVG XML Integrity & README Asset Links
        run: |
          python3 - << 'EOF'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          assets_dir = pathlib.Path("assets")
          svg_files = list(assets_dir.glob("*.svg"))
          assert len(svg_files) >= 3, "Expected at least 3 generated SVG assets in assets/"
          for svg in svg_files:
              ET.parse(svg)
              print(f"✅ Validated XML schema: {svg}")

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          assert "<!-- WEEKLY-INSIGHT:START -->" in readme, "Missing WEEKLY-INSIGHT start marker"
          assert "<!-- WEEKLY-INSIGHT:END -->" in readme, "Missing WEEKLY-INSIGHT end marker"
          print("✅ README structural markers verified.")
          EOF

      - name: Commit & Push Updated Telemetry Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): regenerate profile SVG banners & metrics [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "SVG assets are already up to date."
          fi
