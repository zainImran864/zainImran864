name: Weekly Security & Exposure Audit

on:
  schedule:
    # Runs once a week on Thursdays at 00:00 UTC
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit Repository Exposure & Secret Scanning
        run: |
          echo "Initiating weekly profile & codebase exposure audit..."
          # Verify no secrets or sensitive keys are committed
          if grep -rnEi "(password\s*=\s*['\"][^'\"]+|api_key\s*=\s*['\"][A-Za-z0-9_-]{16,})" --exclude-dir=".git" .; then
            echo "::error::Potential sensitive credentials detected!"
            exit 1
          else
            echo "✅ Zero secret leaks detected. Security posture validated."
          fi

      - name: Workflow File Schedule Audit
        run: |
          echo "Validating that all workflow schedules run weekly..."
          for wf in .github/workflows/*.yml; do
            echo "Inspecting $wf..."
            # Flag any hourly or daily cron pattern (e.g. */1, */24, 0 * * * *, 0 0 * * *)
            if grep -E "cron:\s*['\"][0-9\*/]+\s+(\*|\*/[0-9]+)\s+\*\s+\*\s+\*['\"]" "$wf"; then
              echo "::warning::Workflow $wf contains hourly/daily interval cron!"
            fi
          done
          echo "✅ Workflows validation complete."
