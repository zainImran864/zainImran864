name: Weekly Profile Refresh

on:
  schedule:
    # Runs once a week on Mondays at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-auto-commit
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Weekly Insight & Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README Dynamic Content & Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_readme.py
          python3 .github/scripts/generate_profile_svgs.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): weekly dynamic update [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
